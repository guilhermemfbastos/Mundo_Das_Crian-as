<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo das Crianças</title>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #87CEEB; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { display: block; }

        /* Tela de Carregamento Inicial */
        #loader {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #2c3e50, #000); color: white;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-size: 26px; font-weight: bold; z-index: 100; transition: opacity 0.5s ease;
        }

        /* TELA DE CUSTOMIZAÇÃO (Estilo PK XD Menu) */
        #custom-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4); display: none; z-index: 50;
            justify-content: flex-start; align-items: center; padding-left: 5%;
        }
        .menu-box {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            border: 4px solid #fff; border-radius: 20px; width: 350px; padding: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3); color: white;
        }
        .menu-title { text-align: center; font-size: 22px; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; text-shadow: 2px 2px #000; }
        .section-title { font-size: 14px; margin: 10px 0 5px 0; text-transform: uppercase; color: #ffeaa7; }
        .options-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 15px; }
        .opt-btn { 
            background: #fff; border: 2px solid #ccc; border-radius: 10px; height: 50px; 
            cursor: pointer; font-size: 12px; font-weight: bold; transition: transform 0.1s;
        }
        .opt-btn:hover { transform: scale(1.1); border-color: #fdcb6e; }
        .btn-play {
            width: 100%; background: #00b894; color: white; border: 3px solid #fff;
            padding: 12px; font-size: 18px; font-weight: bold; border-radius: 15px;
            cursor: pointer; text-transform: uppercase; margin-top: 15px; text-shadow: 1px 1px #000;
        }
        .btn-play:hover { background: #05c46b; transform: translateY(-2px); }

        /* Instruções de Jogo Ativo */
        #hud {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.6); color: white; padding: 10px 20px;
            border-radius: 20px; font-size: 14px; pointer-events: none; display: none;
            text-align: center; border: 2px solid #fff;
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="loader">Carregando Cidade...</div>

    <div id="custom-screen">
        <div class="menu-box">
            <div class="menu-title">Crie seu Avatar</div>
            
            <div class="section-title">Cabelo</div>
            <div class="options-grid">
                <button class="opt-btn" onclick="changePart('hair', '#ff7675')">🔴</button>
                <button class="opt-btn" onclick="changePart('hair', '#74b9ff')">🔵</button>
                <button class="opt-btn" onclick="changePart('hair', '#ffeaa7')">🟡</button>
                <button class="opt-btn" onclick="changePart('hair', '#2d3436')">⚫</button>
            </div>

            <div class="section-title">Camisa</div>
            <div class="options-grid">
                <button class="opt-btn" onclick="changePart('torso', '#e84393')">💖</button>
                <button class="opt-btn" onclick="changePart('torso', '#00b894')">💚</button>
                <button class="opt-btn" onclick="changePart('torso', '#0984e3')">💙</button>
                <button class="opt-btn" onclick="changePart('torso', '#6c5ce7')">💜</button>
            </div>

            <div class="section-title">Sapatos</div>
            <div class="options-grid">
                <button class="opt-btn" onclick="changePart('feet', '#ffffff')">⚪</button>
                <button class="opt-btn" onclick="changePart('feet', '#d63031')">🔴</button>
                <button class="opt-btn" onclick="changePart('feet', '#2d3436')">⚫</button>
                <button class="opt-btn" onclick="changePart('feet', '#e17055')">🟠</button>
            </div>

            <div class="section-title">Mochila</div>
            <div class="options-grid">
                <button class="opt-btn" onclick="changePart('backpack', 'none')">❌</button>
                <button class="opt-btn" onclick="changePart('backpack', '#fdcb6e')">🟡</button>
                <button class="opt-btn" onclick="changePart('backpack', '#e84393')">🌸</button>
                <button class="opt-btn" onclick="changePart('backpack', '#00cec9')">🌐</button>
            </div>

            <button class="btn-play" id="start-game">Entrar no Mundo!</button>
        </div>
    </div>

    <div id="hud">Use <b>W, A, S, D</b> para andar e o <b>Mouse</b> para girar a câmera</div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Globais de controle do Jogo
        let gameStarted = false;
        const keys = { w: false, a: false, s: false, d: false };
        const collidableObjects = []; // Array onde guardaremos as malhas da cidade para colisão

        // Configuração Inicial do Three.js
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); 

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Luzes estáveis
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xffffff, 0.7);
        sunLight.position.set(50, 100, 50);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // Controles de órbita (serão manipulados dinamicamente)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;

        // --- CONSTRUÇÃO DO PLAYER DETALHADO (ESTILO TOY ART / VOXEL) ---
        const playerGroup = new THREE.Group();
        
        // Materiais iniciais padrão
        const materials = {
            skin: new THREE.MeshLambertMaterial({ color: '#ffdbac' }),
            hair: new THREE.MeshLambertMaterial({ color: '#2d3436' }),
            torso: new THREE.MeshLambertMaterial({ color: '#0984e3' }),
            legs: new THREE.MeshLambertMaterial({ color: '#2d3436' }),
            feet: new THREE.MeshLambertMaterial({ color: '#ffffff' }),
            backpack: new THREE.MeshLambertMaterial({ color: '#fdcb6e' })
        };

        // Cabeça (Cabeçudo estilo PK XD)
        const headGeo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
        const head = new THREE.Mesh(headGeo, materials.skin);
        head.position.y = 2.4;
        playerGroup.add(head);

        // Cabelo Estilizado (Bloco superior)
        const hairGeo = new THREE.BoxGeometry(1.3, 0.5, 1.3);
        const hair = new THREE.Mesh(hairGeo, materials.hair);
        hair.position.set(0, 2.8, 0);
        playerGroup.add(hair);

        // Olhos
        const eyeGeo = new THREE.BoxGeometry(0.2, 0.2, 0.1);
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
        const leftEye = new THREE.Mesh(eyeGeo, eyeMat); leftEye.position.set(-0.3, 2.5, 0.61);
        const rightEye = new THREE.Mesh(eyeGeo, eyeMat); rightEye.position.set(0.3, 2.5, 0.61);
        playerGroup.add(leftEye, rightEye);

        // Tronco (Camisa)
        const torsoGeo = new THREE.BoxGeometry(1.4, 1.2, 0.8);
        const torso = new THREE.Mesh(torsoGeo, materials.torso);
        torso.position.y = 1.3;
        playerGroup.add(torso);

        // Braços
        const armGeo = new THREE.BoxGeometry(0.35, 1.0, 0.35);
        const leftArm = new THREE.Mesh(armGeo, materials.skin); leftArm.position.set(-0.9, 1.3, 0);
        const rightArm = new THREE.Mesh(armGeo, materials.skin); rightArm.position.set(0.9, 1.3, 0);
        playerGroup.add(leftArm, rightArm);

        // Pernas (Shorts)
        const legGeo = new THREE.BoxGeometry(0.45, 0.6, 0.5);
        const leftLeg = new THREE.Mesh(legGeo, materials.legs); leftLeg.position.set(-0.35, 0.4, 0);
        const rightLeg = new THREE.Mesh(legGeo, materials.legs); rightLeg.position.set(0.35, 0.4, 0);
        playerGroup.add(leftLeg, rightLeg);

        // Sapatos
        const footGeo = new THREE.BoxGeometry(0.5, 0.2, 0.7);
        const leftFoot = new THREE.Mesh(footGeo, materials.feet); leftFoot.position.set(-0.35, 0.1, 0.1);
        const rightFoot = new THREE.Mesh(footGeo, materials.feet); rightFoot.position.set(0.35, 0.1, 0.1);
        playerGroup.add(leftFoot, rightFoot);

        // Mochila (Atrás do Tronco)
        const bpGeo = new THREE.BoxGeometry(1.0, 0.9, 0.4);
        const backpack = new THREE.Mesh(bpGeo, materials.backpack);
        backpack.position.set(0, 1.4, -0.6);
        playerGroup.add(backpack);

        // Ativa sombras no player
        playerGroup.traverse(node => { if(node.isMesh) node.castShadow = true; });
        
        // Posição inicial do Player no centro do mapa
        playerGroup.position.set(0, 5, 0);
        scene.add(playerGroup);

        // Função Global para mudar as cores pelo menu HTML
        window.changePart = function(partName, colorHex) {
            if (colorHex === 'none') {
                backpack.visible = false;
            } else {
                if (partName === 'backpack') backpack.visible = true;
                materials[partName].color.set(colorHex);
            }
        };

        // --- CARREGAMENTO DA CIDADE E CONFIGURAÇÃO DE COLISÃO ---
        const loader = new GLTFLoader();
        loader.setPath('source/');
        
        loader.load('city2.glb?v=1', (gltf) => {
            const city = gltf.scene;
            scene.add(city);

            // Alimenta a lista de objetos colidíveis vasculhando a malha 3D
            city.traverse((node) => {
                if (node.isMesh) {
                    node.receiveShadow = true;
                    node.castShadow = true;
                    collidableObjects.push(node); // Importante: guarda a referência para o teste de pisada
                }
            });

            // Libera a tela de Customização assim que o cenário estiver carregado na memória
            document.getElementById('loader').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('loader').remove();
                document.getElementById('custom-screen').style.display = 'flex';
                // Coloca a câmera focada de frente para o player para customização bonita
                camera.position.set(0, 2, 4);
                controls.target.set(0, 1.5, 0);
            }, 500);

        }, undefined, (err) => {
            console.error(err);
            document.getElementById('loader').innerText = "Erro ao ler a pasta source/city2.glb";
        });

        // Evento de início do jogo ativo
        document.getElementById('start-game').addEventListener('click', () => {
            document.getElementById('custom-screen').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            gameStarted = true;
            
            // Reposiciona a câmera nas costas do Player para modo de jogo em 3ª pessoa
            camera.position.set(playerGroup.position.x, playerGroup.position.y + 6, playerGroup.position.z - 10);
        });

        // Captura de Teclado
        window.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            if(k === 'w' || k === 'arrowup') keys.w = true;
            if(k === 'a' || k === 'arrowleft') keys.a = true;
            if(k === 's' || k === 'arrowdown') keys.s = true;
            if(k === 'd' || k === 'arrowright') keys.d = true;
        });
        window.addEventListener('keyup', (e) => {
            const k = e.key.toLowerCase();
            if(k === 'w' || k === 'arrowup') keys.w = false;
            if(k === 'a' || k === 'arrowleft') keys.a = false;
            if(k === 's' || k === 'arrowdown') keys.s = false;
            if(k === 'd' || k === 'arrowright') keys.d = false;
        });

        // --- SISTEMA DE FÍSICA E MOVIMENTAÇÃO (TICK LOOP) ---
        const playerSpeed = 0.2;
        let playerVelocityY = 0;
        const gravity = 0.015;

        // Raycaster vertical: aponta da cintura do boneco direto para o chão (-Y)
        const raycaster = new THREE.Raycaster();
        const rayDirection = new THREE.Vector3(0, -1, 0);

        function updatePhysics() {
            if (!gameStarted) return;

            // 1. Capturar Vetor de Direção da Câmera para movimentação fluida pelas teclas
            const camDirection = new THREE.Vector3();
            camera.getWorldDirection(camDirection);
            camDirection.y = 0; // Trava movimentação no plano horizontal
            camDirection.normalize();

            const camRight = new THREE.Vector3(-camDirection.z, 0, camDirection.x); // Vetor lateral esquerdo/direito

            let moveX = 0;
            let moveZ = 0;

            if (keys.w) { moveX += camDirection.x; moveZ += camDirection.z; }
            if (keys.s) { moveX -= camDirection.x; moveZ -= camDirection.z; }
            if (keys.a) { moveX += camRight.x; moveZ += camRight.z; }
            if (keys.d) { moveX -= camRight.x; moveZ -= camRight.z; }

            // Se houver comando de movimento, desloca e gira o corpo do personagem na direção certa
            if (moveX !== 0 || moveZ !== 0) {
                const moveVec = new THREE.Vector3(moveX, 0, moveZ).normalize();
                playerGroup.position.x += moveVec.x * playerSpeed;
                playerGroup.position.z += moveVec.z * playerSpeed;
                
                // Rotaciona o boneco de frente para onde ele corre
                const angle = Math.atan2(moveVec.x, moveVec.z);
                playerGroup.rotation.y = angle;
            }

            // 2. DETECÇÃO DE COLISÃO DO CHÃO (RAYCASTING DETALHADO)
            // Lança o raio a partir de 1.5 unidades acima do pé do player
            const rayOrigin = new THREE.Vector3(playerGroup.position.x, playerGroup.position.y + 1.5, playerGroup.position.z);
            raycaster.set(rayOrigin, rayDirection);

            // Testa interceptação com os objetos da cidade carregada
            const intersections = raycaster.intersectObjects(collidableObjects);

            if (intersections.length > 0) {
                const distanceToGround = intersections[0].distance;
                const groundHeight = rayOrigin.y - distanceToGround;

                // Se o pé do jogador estiver próximo ou abaixo da superfície encontrada, ele pisa nela
                if (playerGroup.position.y <= groundHeight + 0.05) {
                    playerGroup.position.y = groundHeight;
                    playerVelocityY = 0; // Anula a gravidade pois está no chão firme
                } else {
                    // Queda livre suave se estiver no ar (descendo degraus ou plataformas)
                    playerVelocityY -= gravity;
                    playerGroup.position.y += playerVelocityY;
                }
            } else {
                // Se saiu das bordas do mapa 3D, cai
                playerVelocityY -= gravity;
                playerGroup.position.y += playerVelocityY;
                
                // Sistema de segurança: Se cair no limbo abaixo da malha, respawna no centro
                if(playerGroup.position.y < -20) {
                    playerGroup.position.set(0, 10, 0);
                    playerVelocityY = 0;
                }
            }

            // Faz a câmera OrbitControls seguir a posição atual do Player pelas ruas
            controls.target.set(playerGroup.position.x, playerGroup.position.y + 1.5, playerGroup.position.z);
        }

        // Ajuste de Tela (Resize)
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Loop Principal
        function animate() {
            requestAnimationFrame(animate);
            updatePhysics();
            controls.update(); 
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo das Crianças</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #87CEEB; /* Azul céu estilo PK XD */
            font-family: sans-serif;
        }

        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            z-index: 10;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="loader">Carregando Mundo das Crianças...</div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. Configuração da Cena, Câmera e Renderizador
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); 

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(80, 50, 80); // Afastei um pouco mais a câmera caso a cidade seja grande

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // 2. Controles de Câmera (Mouse gira, arrasta e dá zoom)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.05; 

        // 3. Iluminação estilo Cartoon
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 0.6);
        sunLight.position.set(40, 80, 40);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // 4. Carregar o Modelo 3D correto (city2.glb)
        const loader = new GLTFLoader();
        const loaderElement = document.getElementById('loader');

        // CORREÇÃO AQUI: Nome exato do seu arquivo atualizado
        const nomeDoArquivo = 'city2.glb'; 

        loader.setPath('source/'); 
        
        loader.load(nomeDoArquivo, (gltf) => {
            const city = gltf.scene;
            
            // Ativa sombras nos objetos da cidade
            city.traverse((node) => {
                if (node.isMesh) {
                    node.castShadow = true;
                    node.receiveShadow = true;
                }
            });

            city.position.set(0, 0, 0); 
            scene.add(city);

            // Esconde a tela de carregamento
            if (loaderElement) {
                loaderElement.style.opacity = '0';
                setTimeout(() => loaderElement.remove(), 500);
            }

        }, (xhr) => {
            if (xhr.total > 0 && loaderElement) {
                const progresso = Math.round((xhr.loaded / xhr.total * 100));
                loaderElement.innerText = `Carregando Cidade: ${progresso}%`;
            }
        }, (error) => {
            console.error('Erro ao carregar o modelo:', error);
            if (loaderElement) {
                loaderElement.innerText = "Erro ao encontrar o arquivo city2.glb dentro da pasta source!";
            }
        });

        // 5. Ajuste de Tela Automático (Resize)
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 6. Loop de Renderização
        function animate() {
            requestAnimationFrame(animate);
            controls.update(); 
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
